name: CI

on:
  push:
    branches: [main]
    paths:
      - 'BusinessCurator/**'
      - 'GmailGrabber/**'
      - 'JootoGrabber/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'BusinessCurator/**'
      - 'GmailGrabber/**'
      - 'JootoGrabber/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

# marketplace 未掲載の CorporateStrategist / ParsBanana は対象外（中断中の途中成果物）。

# ruff / mypy は版で検査結果が変わるため固定する（無指定だと上流リリースで突然 red になる）。
# 更新は「版を上げて指摘を解消する」commit として意図的に行う（自動追随させない）。

jobs:
  # =============================================================================
  # BusinessCurator Jobs
  # =============================================================================

  lint-businesscurator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff linter
        working-directory: BusinessCurator
        run: ruff check scripts/

      - name: Run ruff formatter check
        working-directory: BusinessCurator
        run: ruff format --check scripts/

  type-check-businesscurator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy==2.3.0

      - name: Run mypy
        working-directory: BusinessCurator/scripts
        run: mypy --explicit-package-bases .

  test-businesscurator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e BusinessCurator[dev]

      - name: Run tests
        working-directory: BusinessCurator
        run: python -m pytest

  # =============================================================================
  # GmailGrabber Jobs
  # =============================================================================

  lint-gmailgrabber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff linter
        working-directory: GmailGrabber
        run: ruff check scripts/

      - name: Run ruff formatter check
        working-directory: GmailGrabber
        run: ruff format --check scripts/

  type-check-gmailgrabber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy==2.3.0

      - name: Run mypy
        working-directory: GmailGrabber/scripts
        run: mypy --explicit-package-bases .

  test-gmailgrabber:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e GmailGrabber[dev]

      - name: Run tests
        working-directory: GmailGrabber
        run: python -m pytest

  # =============================================================================
  # JootoGrabber Jobs
  # =============================================================================

  lint-jootograbber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Run ruff linter
        working-directory: JootoGrabber
        run: ruff check scripts/

      - name: Run ruff formatter check
        working-directory: JootoGrabber
        run: ruff format --check scripts/

  type-check-jootograbber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install mypy
        run: pip install mypy==2.3.0

      - name: Run mypy
        working-directory: JootoGrabber/scripts
        run: mypy --explicit-package-bases .

  test-jootograbber:

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jootograbber"
version = "0.1.0"
description = "JootoGrabber - Clean Architecture Jooto API backup (X-Jooto-Api-Key), board/task export, incremental sync"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Weave"}
]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["commands*", "skills*", "docs*"]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-cov~=6.0",
    "ruff~=0.16.0",
    "mypy~=2.3.0",
    "hypothesis~=6.122",
]

[tool.pytest.ini_options]
testpaths = ["scripts/test"]
pythonpath = ["scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: 単体テスト（高速、外部依存なし）",
    "integration: 統合テスト（ファイルI/O・ネットワークスタブ）",
    "property: Property-based tests using hypothesis",
    "cli: CLI統合テスト（subprocess経由）",
    "slow: 時間のかかるテスト",
]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["scripts"]
branch = true
omit = ["scripts/test/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
    "@runtime_checkable",
]

[tool.ruff]
target-version = "py310"
src = ["scripts"]
include = ["scripts/**/*.py"]
exclude = [".pytest_cache", ".mypy_cache", ".ruff_cache", "__pycache__", ".venv", "*.egg-info"]



[tool.ruff.lint]
# ruff の default 選択は版が上がるたび広がるので明示固定する。集合はワークスペース共通の 10 個。
# 狭い select では CI が green のまま旧記法・危険記法（B904 の例外連鎖切断、SIM115 の
# リソース未解放、PTH の os.path 残存）が溜まる経路が開いたままになる。
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "B", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"scripts/test/*" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["domain", "application", "infrastructure", "interfaces"]
known-third-party = ["pytest", "hypothesis"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_redundant_casts = true
warn_unused_configs = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "application.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "infrastructure.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "interfaces.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true
